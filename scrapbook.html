<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapbook</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ⭐ Sofia Corner Stickers ⭐ -->
    <img src="sofia1.png" class="sofia-corner tl">
    <img src="sofia2.png" class="sofia-corner tr">
    <img src="sofia3.png" class="sofia-corner bl">
    <img src="sofia4.png" class="sofia-corner br">



    <header>
        <h1>💖My Scrapbook💖</h1>
    </header>

    <main>
        <section class="card">
            <div class="scrapbook-gallery">

                <div class="polaroid">
                    <img src="picture1.jpg" class="zoom-img" alt="Scrapbook Photo">
                    <p>Happy Moments</p>
                </div>

                <div class="polaroid">
                    <img src="picture2.jpg" class="zoom-img" alt="Scrapbook Photo">
                    <p>With my Fam</p>
                </div>

                <div class="polaroid">
                    <img src="picture3.jpg" class="zoom-img" alt="Scrapbook Photo">
                    <p>Graduation Day</p>
                </div>

                <div class="polaroid">
                    <img src="picture4.jpg" class="zoom-img" alt="Scrapbook Photo">
                    <p>Collections</p>
                </div>

                <div class="polaroid">
                    <img src="picture5.jpg" class="zoom-img" alt="Scrapbook Photo">
                    <p>Sleepover</p>
                </div>

                <div class="polaroid">
                    <img src="picture6.jpg" class="zoom-img" alt="Scrapbook Photo">
                    <p>Choir</p>
                </div>

                <div class="polaroid">
                    <img src="picture7.jpg" class="zoom-img" alt="Scrapbook Photo">
                    <p>Parade of Saints</p>
                </div>

                <div class="polaroid">
                    <img src="picture8.jpg" class="zoom-img" alt="Scrapbook Photo">
                    <p>My Bby💖 </p>
                </div>

            </div>

            <p class="quote">“Collect moments, not things.”</p>

            <div class="music-center">
                <audio controls>
                    <source src="music.mp3" type="audio/mp3">
                </audio>
            </div>

            <a href="index.html" class="back-btn">← Back to Home</a>
        </section>
    </main>

</body>

</html>
